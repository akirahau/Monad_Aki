<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akira - Mint muBOND</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header>
            <div class="logo">
                <img src="logo.png" alt="Akira Logo">
                <span>Akira</span>
            </div>
            <div class="stats">
                <div class="stat-item">
                    <span>TVL</span>
                    <p>$1,195,694.19</p>
                </div>
                <div class="stat-item">
                    <span>7d APY</span>
                    <p>10.00%</p>
                </div>
                <div class="stat-item">
                    <span>$muBOND Price</span>
                    <p>$1.018</p>
                </div>
            </div>
            <div class="user-info">
                <span id="user-balance">0 AKI</span>
                <button class="connect-btn" id="connect-btn">Connect</button>
            </div>
        </header>

        <!-- Mint Section -->
        <div class="mint-section">
            <h1>MINT <span>$AKI</span></h1>
            <div class="mint-form">
                <div class="balance">
                    <p id="usdc-balance">Balance: 0 USDC</p>
                </div>
                <div class="input-group">
                    <input type="number" placeholder="0" id="mint-amount">
                    <select id="token-select">
                        <option value="USDC">USDC</option>
                    </select>
                </div>
                <button class="mint-btn" id="mint-btn">MINT</button>
            </div>
        </div>
    </div>

    <!-- Thêm Web3.js -->
    <script src="https://cdn.jsdelivr.net/npm/web3@1.7.4/dist/web3.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
